<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#a8dcf0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icono-192.png">
  <link rel="apple-touch-icon" href="icono-192.png">
  <title>Aprende el abecedario</title>
  <style>
    @font-face { font-family: "Baloo2"; src: url("assets/fuentes/Baloo2.ttf"); font-weight: 400 800; }
    html, body {
      margin: 0; height: 100%; background: #9fd6ee; overflow: hidden;
      overscroll-behavior: none; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    /* El juego se dibuja en 1280x720 y se escala para llenar la pantalla sin deformarse */
    #lienzo { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); touch-action: none; }
    #girar {
      display: none; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center;
      background: #a8dcf0; color: #3c3c46; font: 700 26px/1.3 "Baloo2", "Comic Sans MS", sans-serif;
      text-align: center; padding: 24px;
    }
    @media (orientation: portrait) { #girar { display: flex; } }
  </style>
</head>
<body>
  <canvas id="lienzo"></canvas>
  <div id="girar">Gira la tablet para jugar<br>(de forma horizontal)</div>
  <script src="juego.js"></script>
</body>
</html>
